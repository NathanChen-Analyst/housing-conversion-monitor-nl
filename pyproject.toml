[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcm"
version = "0.1.0"
description = "Housing Conversion Monitor NL: detect and forecast non-residential-to-residential conversions from BAG lifecycle data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nathan Chen" }]
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]
geo = ["geopandas>=0.14", "shapely>=2"]
quality = ["pandera>=0.20"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8", "tabulate"]
dbt = ["dbt-duckdb>=1.8"]
explain = ["shap>=0.45"]
all = ["hcm[dev,geo,quality,orchestration,dbt]"]

[project.scripts]
hcm = "hcm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# long SQL / HTML string literals and decorator descriptions
"src/hcm/quality.py" = ["E501"]
"src/hcm/mutations.py" = ["E501"]
"src/hcm/staging.py" = ["E501"]
"src/hcm/detector.py" = ["E501"]
"src/hcm/cli.py" = ["E501"]
"src/hcm/conversions.py" = ["E501"]
"orchestration/*" = ["E501"]
"scripts/*" = ["E501"]
