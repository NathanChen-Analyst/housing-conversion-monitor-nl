name: hcm
version: "1.0.0"
config-version: 2
profile: hcm

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  first_year: 2012
  last_year: 2024
  suppress_below: 3
  staging_dir: "../data/staging"

models:
  hcm:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
